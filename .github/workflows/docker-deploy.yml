name: Build & deploy (Docker)

on:
  push:
    branches: [main]
    paths: ['cms/**', '.github/workflows/docker-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/royal-reelz" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: cms
          push: true
          platforms: linux/arm64
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SERVER_URL=https://royalreelz.sandvirp.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Roll out on OCI
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd /opt/webapp
            docker compose pull royal-reelz
            docker compose up -d --remove-orphans royal-reelz
            docker image prune -f
            # Notify failure must not fail the deploy (same as mobile release.sh).
      - name: Notify Zoho Cliq
        if: success() || failure()
        continue-on-error: true
        env:
          CLIQ_WEBHOOK_URL: ${{ secrets.CLIQ_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$CLIQ_WEBHOOK_URL" ]; then
            echo "::warning::CLIQ_WEBHOOK_URL not set — skipping Cliq"
            exit 0
          fi
          NAME="Royal Reelz"
          ENV_TAG=PROD
          if [ "$JOB_STATUS" = "success" ]; then STATUS="✅"; else STATUS="❌ FAILED"; fi
          MSG=$(printf '%s' "$COMMIT_MSG" | head -n1)
          TEXT=$(printf '*%s %s Web Release*  %s\n🔖 %s by %s\n💬 %s\n🔗 %s' \
            "$NAME" "$ENV_TAG" "$STATUS" "${GITHUB_SHA::7}" "$ACTOR" "${MSG:-manual run}" "$RUN_URL")
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$CLIQ_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg t "$TEXT" '{text: $t}')" 2>/dev/null || echo "000")
          if [ "$CODE" = "200" ] || [ "$CODE" = "204" ]; then
            echo "Posted to Cliq"
          else
            echo "::warning::Cliq post failed (HTTP $CODE)"
          fi

