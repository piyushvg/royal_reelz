name: Build & deploy (Docker)

on:
  push:
    branches: [main]
    paths: ['cms/**', '.github/workflows/docker-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/royal-reelz" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: cms
          push: true
          platforms: linux/arm64
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SERVER_URL=https://royalreelz.sandvirp.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Roll out on OCI
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd /opt/webapp
            docker compose pull royal-reelz
            docker compose up -d --remove-orphans royal-reelz
            docker image prune -f
